name: Build Debian Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Package Folder
        run: |
          # 1. Tạo cấu trúc thư mục chuẩn cho gói deb
          mkdir -p my_package/DEBIAN
          
          # 2. Đưa file control vào đúng vị trí bắt buộc của nó
          cp control my_package/DEBIAN/
          
          # 3. Gom các file cần thiết khác vào gói (ví dụ Makefile, README, v.v. nếu cần thiết)
          # Hiện tại chưa rõ các file này của bạn sẽ cài vào đâu trên Linux, 
          # tạm thời gom tất cả file gốc vào để tránh lỗi trống thư mục.
          # cp -Rf <ten_file> my_package/ 2>/dev/null || true
          
          # 4. Phân quyền chuẩn cho file control (phải là 644)
          chmod 644 my_package/DEBIAN/control

      - name: Build .deb Package
        run: |
          dpkg-deb --build my_package product.deb

      - name: Upload Debian Package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: product.deb
